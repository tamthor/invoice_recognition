{% extends 'base.html' %}

{% block title %}Thống kê{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<body class="bg-gray-200">

<main class="p-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div class="bg-white p-4 shadow rounded">
            <h2 class="bg-teal-500 text-white p-2 rounded-t">Information</h2>
            <div class="p-4">
                <p class="text-2xl font-bold">Information</p>
            </div>
        </div>
        <div class="col-span-2 bg-white p-4 shadow rounded">
            <h2 class="bg-teal-500 text-white p-2 rounded-t">Dashboard Statistics</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4">
                <!-- Staff is removed -->
                <div class="bg-white p-4 shadow rounded text-center hover-highlight transition-transform duration-200">
                    <a href="{% url 'warehouse' %}">
                        <p class="text-xl font-bold">Products <i class="fas fa-box"></i></p>
                        <p class="text-2xl">{{ products_count }}</p> <!-- Show count of products -->
                    </a>

                </div>
                <div class="bg-white p-4 shadow rounded text-center hover-highlight transition-transform duration-200">
                    <a href="{% url 'orders_list' %}">
                        <p class="text-xl font-bold">Orders <i class="fas fa-truck"></i></p>
                        <p class="text-2xl">{{ orders_count }}</p> <!-- Show count of orders -->
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white p-4 shadow rounded">
            <h1>Dashboard - Doanh mục sản phẩm</h1>

            <!-- Biểu đồ thể hiện số lượng sản phẩm trong từng danh mục -->
            <canvas id="categoryChart" width="400" height="200"></canvas>
        
        </div>
        <div class="bg-white p-4 shadow rounded">
            <p class="text-xl font-bold">{{ result|linebreaksbr }}</p>
        </div>
    </div>
</main>

</body>

<style>
    .hover-highlight:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
    }
</style>

{% endblock content %}
