{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container mt-4">
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="text-center">Camera Scanner</h5>
                </div>
                <div class="card-body">
                    <!-- Camera selection -->
                    <div class="form-group mb-2">
                        <label for="cameraSelect" class="small">Chọn Camera:</label>
                        <select id="cameraSelect" class="form-control form-control-sm mb-2">
                            <option value="">Đang tải danh sách camera...</option>
                        </select>
                    </div>

                    <!-- Camera container với khung căn chỉnh -->
                    <div id="camera-container" class="position-relative" style="display: none;">
                        <video id="video" class="w-100" playsinline autoplay></video>
                        <!-- Overlay tối xung quanh khung -->
                        <div class="scan-overlay"></div>
                        <!-- Khung căn chỉnh A5 -->
                        <div id="alignment-frame">
                            <div class="corner top-left"></div>
                            <div class="corner top-right"></div>
                            <div class="corner bottom-left"></div>
                            <div class="corner bottom-right"></div>
                            <div class="guide-text">Căn chỉnh hóa đơn vào khung</div>
                        </div>
                        <!-- Canvas cho xử lý độ sáng -->
                        <canvas id="canvasOutput" style="display: none;"></canvas>
                    </div>

                    <!-- Canvas để chụp ảnh (ẩn) -->
                    <canvas id="canvas" style="display:none;"></canvas>

                    <!-- Nút điều khiển -->
                    <div class="text-center mt-3">
                        <button id="startButton" class="btn btn-sm btn-primary">Mở Camera</button>
                        <button id="stopButton" class="btn btn-sm btn-danger" style="display: none;">Tắt Camera</button>
                    </div>

                    <!-- Thông báo trạng thái -->
                    <div id="status" class="alert alert-sm mt-2" style="display: none;"></div>
                </div>
            </div>
        </div>

        <!-- Panel hiển thị dữ liệu trích xuất -->
        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-header py-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">Thông tin hóa đơn</h6>
                        <span class="badge bg-primary" id="invoice-status">Đang chờ quét...</span>
                    </div>
                </div>
                <div class="card-body p-2">
                    <!-- Thông tin nhà cung cấp -->
                    <div class="supplier-info mb-2">
                        <div class="row g-2">
                            <div class="col-12 d-flex gap-2">
                                <div class="form-group flex-grow-1" style="width: 30%;">
                                    <label class="form-label small text-muted mb-1">Mã nhà cung cấp</label>
                                    <input type="text" class="form-control form-control-sm" id="supplier-code" readonly>
                                </div>
                                <div class="form-group flex-grow-1" style="width: 30%;">
                                    <label class="form-label small text-muted mb-1">Số phiếu</label>
                                    <input type="text" class="form-control form-control-sm" id="invoice-number"
                                        readonly>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-group mb-2">
                                    <label class="form-label small text-muted mb-1">Tên nhà cung cấp</label>
                                    <input type="text" class="form-control form-control-sm" id="supplier-name" readonly>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bảng sản phẩm -->
                    <div class="table-responsive">
                        <table class="table table-sm table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="text-center" style="width: 40px">STT</th>
                                    <th style="width: 100px">Mã hàng</th>
                                    <th style="min-width: 200px">Tên hàng</th>
                                    <th style="width: 90px">ĐVT</th>
                                    <th style="width: 0px" class="text-end">Số lượng</th>
                                </tr>
                            </thead>
                            <tbody id="product-list">
                                <tr>
                                    <td colspan="5" class="text-center text-muted py-2">
                                        <i class="fas fa-receipt me-1"></i>Chưa có dữ liệu
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    :root {
        --frame-width: 85%;
        --frame-height: 85%;
    }

    #camera-container {
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
        height: 90vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        max-height: 90vh; /* Thêm max-height để tránh overflow */
    }

    #video {
        max-width: 100%;
        max-height: 100%;
        width: auto; /* Cho phép width tự động điều chỉnh */
        height: auto; /* Cho phép height tự động điều chỉnh */
        background-color: #000;
        object-fit: contain;
    }

    .scan-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        pointer-events: none;
    }

    #alignment-frame {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: var(--frame-width);
        height: var(--frame-height);
        border: 2px solid rgba(255, 255, 255, 0.5);
        box-sizing: border-box;
        pointer-events: none;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    }

    .guide-text {
        position: absolute;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 12px;
        top: -20px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }

    .corner {
        position: absolute;
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .top-left {
        top: -2px;
        left: -2px;
        border-right: none;
        border-bottom: none;
    }

    .top-right {
        top: -2px;
        right: -2px;
        border-left: none;
        border-bottom: none;
    }

    .bottom-left {
        bottom: -2px;
        left: -2px;
        border-right: none;
        border-top: none;
    }

    .bottom-right {
        bottom: -2px;
        right: -2px;
        border-left: none;
        border-top: none;
    }

    @media (max-width: 768px) {
        :root {
            --frame-width: 85%;
            --frame-height: 95%;
        }

        .guide-text {
            font-size: 10px;
            top: -15px;
        }
    }

    @keyframes alignSuccess {
        0% {
            border-color: rgba(255, 255, 255, 0.5);
        }

        50% {
            border-color: rgba(40, 167, 69, 0.8);
        }

        100% {
            border-color: rgba(255, 255, 255, 0.5);
        }
    }

    .aligned {
        animation: alignSuccess 1s infinite;
    }

    /* Style cho layout chính */
    .container {
        min-width: 1200px;
    }

    .row {
        display: flex;
        margin: 0;
    }

    /* Style cho camera scanner - cố định kích thước */
    .col-md-4 {
        width: 450px;
        min-width: 450px;
        flex: 0 0 450px;
        padding-right: 15px;
    }

    .col-md-4 .card {
        width: 100%;
        min-height: 300px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    /* Style cho panel thông tin hóa đơn */
    .col-md-8 {
        flex: 1;
        min-width: 0;
        padding-left: 15px;
    }

    .col-md-8 .card {
        height: 100%;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .col-md-8 .card-header {
        padding: 0.5rem;
        background-color: #fff;
        border-bottom: 1px solid rgba(0, 0, 0, .125);
    }

    .col-md-8 .card-body {
        padding: 0.75rem;
    }

    /* Style cho supplier info */
    .supplier-info {
        background-color: #f8f9fa;
        padding: 0.75rem;
        border-radius: 0.25rem;
        margin-bottom: 0.75rem;
    }

    /* Style cho form controls */
    .form-control-sm {
        height: calc(1.5em + 0.5rem + 1px);
        padding: 0.25rem 0.5rem;
        font-size: 0.813rem;
        min-width: 0;
        /* Cho phép input thu nhỏ */
    }

    .form-label {
        margin-bottom: 0.25rem;
        white-space: nowrap;
        /* Giữ label trên một dòng */
    }

    /* Style cho bảng sản phẩm */
    .table-responsive {
        min-width: 0;
        /* Cho phép bảng thu nhỏ */
        margin: 0 auto;
        max-width: 100%;
    }

    .table {
        font-size: 0.813rem;
        margin-bottom: 0;
        width: 100%;
        text-align: center;
    }

    .table th {
        font-weight: 600;
        background-color: #f8f9fa;
        padding: 0.5rem;
        white-space: nowrap;
        vertical-align: middle;
    }

    .table td {
        padding: 0.5rem;
        vertical-align: middle;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Tối ưu hiển thị text trong bảng */
    .table td:nth-child(3) {
        /* Cột tên hàng */
        max-width: none;
        text-align: left;
        min-width: 200px;
    }

    .table td:first-child {
        /* Cột STT */
        width: 40px;
    }

    .table td:nth-child(2) {
        /* Cột mã hàng */
        width: 80px;
    }

    .table td:nth-child(4) {
        /* Cột ĐVT */
        width: 60px;
    }

    .table td:last-child {
        /* Cột số lượng */
        width: 80px;
        text-align: end;
    }

    /* Style cho invoice status badge */
    #invoice-status {
        font-size: 0.75rem;
        padding: 0.35em 0.65em;
        white-space: nowrap;
    }

    /* Đảm bảo các phần tử không bị overflow */
    .form-group,
    .table-responsive {
        min-width: 0;
        width: 100%;
    }
</style>

<script>
    let video = document.getElementById('video');
    let canvas = document.getElementById('canvas');
    let canvasOutput = document.getElementById('canvasOutput');
    let startButton = document.getElementById('startButton');
    let stopButton = document.getElementById('stopButton');
    let cameraSelect = document.getElementById('cameraSelect');
    let cameraContainer = document.getElementById('camera-container');
    let statusDiv = document.getElementById('status');
    let stream = null;
    let captureTimeout = null;
    let isAligned = false;
    let lastAlignmentTime = 0;
    let isCapturing = false;
    let countdownInterval = null;
    let countdown = 5;
    let previousFrame = null;
    let motionThreshold = 30;
    let alignmentStartTime = null;

    // Hiển thị thông báo trạng thái
    function showStatus(message, type = 'info') {
        statusDiv.textContent = message;
        statusDiv.className = `alert alert-${type} mt-3`;
        statusDiv.style.display = 'block';
    }

    // Kiểm tra căn chỉnh hóa đơn trong khung
    function checkAlignment() {
        if (!stream || isCapturing) return;

        try {
            // Kiểm tra xem video có đang hoạt động không
            if (!video.videoWidth || !video.videoHeight) {
                return;
            }

            const ctx = canvasOutput.getContext('2d', { willReadFrequently: true });
            const frame = document.getElementById('alignment-frame');
            const rect = frame.getBoundingClientRect();
            const videoRect = video.getBoundingClientRect();

            // Tính toán tỷ lệ scale giữa video và canvas
            const scaleX = video.videoWidth / videoRect.width;
            const scaleY = video.videoHeight / videoRect.height;

            // Tính toán vị trí và kích thước thực của khung trong video
            const frameX = (rect.left - videoRect.left) * scaleX;
            const frameY = (rect.top - videoRect.top) * scaleY;
            const frameWidth = rect.width * scaleX;
            const frameHeight = rect.height * scaleY;

            // Kiểm tra giá trị hợp lệ
            if (frameX < 0 || frameY < 0 || frameWidth <= 0 || frameHeight <= 0) {
                return;
            }

            // Vẽ frame hiện tại vào canvas
            canvasOutput.width = video.videoWidth;
            canvasOutput.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            // Lấy dữ liệu pixel trong khung
            const frameImageData = ctx.getImageData(frameX, frameY, frameWidth, frameHeight);
            const frameData = frameImageData.data;

            // Tính toán độ sáng trung bình trong khung
            let totalFrameBrightness = 0;
            for (let i = 0; i < frameData.length; i += 4) {
                const r = frameData[i];
                const g = frameData[i + 1];
                const b = frameData[i + 2];
                totalFrameBrightness += (r + g + b) / 3;
            }
            const averageFrameBrightness = totalFrameBrightness / (frameData.length / 4);

            // Lấy dữ liệu pixel bên ngoài khung
            const outsideImageData = ctx.getImageData(0, 0, canvasOutput.width, canvasOutput.height);
            const outsideData = outsideImageData.data;

            // Tính toán độ sáng trung bình bên ngoài khung
            let totalOutsideBrightness = 0;
            let outsidePixelCount = 0;

            for (let y = 0; y < canvasOutput.height; y++) {
                for (let x = 0; x < canvasOutput.width; x++) {
                    if (x < frameX || x > frameX + frameWidth || y < frameY || y > frameY + frameHeight) {
                        const idx = (y * canvasOutput.width + x) * 4;
                        const r = outsideData[idx];
                        const g = outsideData[idx + 1];
                        const b = outsideData[idx + 2];
                        totalOutsideBrightness += (r + g + b) / 3;
                        outsidePixelCount++;
                    }
                }
            }

            const averageOutsideBrightness = totalOutsideBrightness / outsidePixelCount;
            const contrast = averageFrameBrightness - averageOutsideBrightness;
            const contrastThreshold = 50;

            // Kiểm tra chuyển động
            const currentFrame = ctx.getImageData(frameX, frameY, frameWidth, frameHeight);
            const hasMotion = previousFrame ? checkMotion(currentFrame, previousFrame) : false;
            previousFrame = currentFrame;

            if (contrast > contrastThreshold) {
                if (!isAligned) {
                    isAligned = true;
                    alignmentStartTime = Date.now();
                    document.getElementById('alignment-frame').classList.add('aligned');
                    showStatus('Đã phát hiện hóa đơn! Giữ yên...', 'success');
                    startCountdown();
                } else if (hasMotion) {
                    // Reset countdown nếu phát hiện chuyển động
                    resetCountdown();
                }
            } else {
                if (isAligned) {
                    resetAlignment();
                }
            }

        } catch (err) {
            console.error('Error in checkAlignment:', err);
            // Nếu có lỗi, dừng kiểm tra căn chỉnh
            if (captureTimeout) {
                cancelAnimationFrame(captureTimeout);
                captureTimeout = null;
            }
            return;
        }

        captureTimeout = requestAnimationFrame(checkAlignment);
    }

    // Hàm kiểm tra chuyển động
    function checkMotion(currentFrame, previousFrame) {
        const data1 = currentFrame.data;
        const data2 = previousFrame.data;
        let changedPixels = 0;
        const totalPixels = (data1.length / 4);
        const minChangedPixels = totalPixels * 0.01; // 1% thay đổi

        for (let i = 0; i < data1.length; i += 16) { // Kiểm tra cứ 4 pixel
            const diffR = Math.abs(data1[i] - data2[i]);
            const diffG = Math.abs(data1[i + 1] - data2[i + 1]);
            const diffB = Math.abs(data1[i + 2] - data2[i + 2]);

            if (diffR > motionThreshold || diffG > motionThreshold || diffB > motionThreshold) {
                changedPixels++;
                if (changedPixels > minChangedPixels) {
                    return true;
                }
            }
        }
        return false;
    }

    // Hàm bắt đầu đếm ngược
    function startCountdown() {
        if (countdownInterval) {
            clearInterval(countdownInterval);
        }
        
        countdown = 5;
        const startTime = Date.now();
        
        countdownInterval = setInterval(() => {
            const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
            const remaining = 5 - elapsedSeconds;
            
            if (remaining > 0) {
                showStatus(`Giữ yên! Chụp sau ${remaining} giây...`, 'success');
            } else {
                clearInterval(countdownInterval);
                captureImage();
                resetAlignment();
            }
        }, 200);
    }

    // Hàm reset đếm ngược
    function resetCountdown() {
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
        showStatus('Phát hiện chuyển động! Vui lòng giữ yên hóa đơn', 'warning');
        alignmentStartTime = Date.now();
        startCountdown();
    }

    // Hàm reset trạng thái căn chỉnh
    function resetAlignment() {
        isAligned = false;
        alignmentStartTime = null;
        document.getElementById('alignment-frame').classList.remove('aligned');
        showStatus('Di chuyển hóa đơn vào khung', 'warning');
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
    }

    // Lấy danh sách camera
    async function getCameraDevices() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');

            cameraSelect.innerHTML = '';

            // Hiển thị thông tin debug về các thiết bị camera
            console.log('Danh sách thiết bị camera:', videoDevices.map(d => ({ id: d.deviceId, label: d.label })));

            videoDevices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;

                // Cải thiện nhận diện các loại camera
                if (device.label.includes('Camo') || device.label.includes('camo') ||
                    device.label.includes('DroidCam') || device.label.includes('droidcam') ||
                    device.label.includes('EpocCam') || device.label.includes('epoccam') ||
                    device.label.includes('iRun') || device.label.includes('irun')) {
                    option.text = 'Camera điện thoại (Camo/iRun)';
                } else {
                    option.text = device.label || `Camera ${cameraSelect.length + 1}`;
                }
                cameraSelect.appendChild(option);
            });

            if (videoDevices.length === 0) {
                showStatus('Không tìm thấy camera nào. Vui lòng kiểm tra lại Camo Studio hoặc cấp quyền truy cập camera.', 'warning');
                startButton.disabled = true;
            } else {
                showStatus(`Đã tìm thấy ${videoDevices.length} camera`, 'info');
            }
        } catch (err) {
            console.error('Lỗi khi lấy danh sách camera:', err);
            showStatus('Lỗi khi tải danh sách camera. Vui lòng kiểm tra lại Camo Studio và quyền truy cập.', 'danger');
        }
    }

    // Khởi tạo khi trang được tải
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            // Tăng thời gian chờ khi khởi tạo camera
            const initialStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });
            initialStream.getTracks().forEach(track => track.stop());
            await getCameraDevices();
        } catch (err) {
            console.error('Lỗi khởi tạo:', err);

            // Xử lý lỗi timeout cụ thể
            if (err.name === 'AbortError' && err.message.includes('Timeout')) {
                showStatus('Lỗi kết nối camera: Hết thời gian chờ. Vui lòng kiểm tra lại kết nối camera và thử lại.', 'danger');
            } else {
                showStatus('Không thể truy cập camera. Vui lòng kiểm tra kết nối và quyền truy cập.', 'danger');
            }
        }
    });

    // Khởi tạo camera
    async function startCamera() {
        try {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            // Hiển thị thông báo đang kết nối
            showStatus('Đang kết nối với camera...', 'info');

            const constraints = {
                video: {
                    deviceId: cameraSelect.value ? { exact: cameraSelect.value } : undefined,
                    width: { ideal: 3840 }, // Tăng kích thước tối đa
                    height: { ideal: 2160 }, // Tăng kích thước tối đa
                    facingMode: 'environment',
                    aspectRatio: { ideal: 1.7777777778 } // Bỏ ràng buộc tỷ lệ cố định
                }
            };

            // Thử kết nối với camera
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;

            // Đợi video sẵn sàng
            await new Promise((resolve, reject) => {
                const timeoutId = setTimeout(() => {
                    reject(new Error('Timeout khi đợi video sẵn sàng'));
                }, 20000);

                video.onloadedmetadata = () => {
                    clearTimeout(timeoutId);
                    video.play()
                        .then(resolve)
                        .catch(reject);
                };
            });

            cameraContainer.style.display = 'block';
            startButton.style.display = 'none';
            stopButton.style.display = 'inline-block';

            isCapturing = false;
            isAligned = false;

            checkAlignment();

            showStatus('Camera đang hoạt động', 'success');
        } catch (err) {
            console.error("Không thể truy cập camera:", err);

            let errorMessage = 'Không thể truy cập camera. ';

            if (err.name === 'AbortError' && err.message.includes('Timeout')) {
                errorMessage += 'Hết thời gian chờ kết nối. Vui lòng kiểm tra lại kết nối camera và thử lại.';
            } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                errorMessage += 'Quyền truy cập camera bị từ chối. Vui lòng cấp quyền truy cập camera trong cài đặt trình duyệt.';
            } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                errorMessage += 'Không tìm thấy camera. Vui lòng kiểm tra kết nối camera.';
            } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                errorMessage += 'Camera đang được sử dụng bởi ứng dụng khác. Vui lòng đóng các ứng dụng đang sử dụng camera.';
            } else if (err.name === 'OverconstrainedError' || err.name === 'ConstraintNotSatisfiedError') {
                errorMessage += 'Không thể đáp ứng các yêu cầu về camera. Vui lòng thử lại với cài đặt khác.';
            } else if (err.name === 'TypeError') {
                errorMessage += 'Lỗi cú pháp. Vui lòng thử lại.';
            } else {
                errorMessage += 'Vui lòng kiểm tra kết nối và quyền truy cập.';
            }

            showStatus(errorMessage, 'danger');

            startButton.style.display = 'inline-block';
            stopButton.style.display = 'none';
        }
    }

    // Dừng camera
    function stopCamera() {
        isCapturing = false;

        if (captureTimeout) {
            cancelAnimationFrame(captureTimeout);
            captureTimeout = null;
        }

        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
            cameraContainer.style.display = 'none';
            startButton.style.display = 'inline-block';
            stopButton.style.display = 'none';

            showStatus('Camera đã được tắt', 'info');
        }
    }

    // Thêm hàm xóa kết quả tìm kiếm
    function clearSearchResults() {
        console.log('Clearing search results...');
        // Xóa dữ liệu trong các trường nhập liệu
        document.getElementById('supplier-code').value = '';
        document.getElementById('supplier-name').value = '';
        document.getElementById('invoice-number').value = '';

        // Xóa bảng sản phẩm
        const productList = document.getElementById('product-list');
        if (productList) {
            productList.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-muted py-2">
                        <i class="fas fa-receipt me-1"></i>Chưa có dữ liệu
                    </td>
                </tr>
            `;
        }

        // Reset trạng thái
        const statusBadge = document.getElementById('invoice-status');
        if (statusBadge) {
            statusBadge.textContent = 'Đang chờ quét...';
            statusBadge.className = 'badge bg-primary';
        }

        // Xóa thông báo trạng thái
        if (statusDiv) {
            statusDiv.style.display = 'none';
        }
    }

    // Thêm event listener cho các tab chức năng tra cứu sử dụng event delegation
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Setting up event delegation...');
        
        // Sử dụng event delegation
        document.body.addEventListener('click', function(e) {
            console.log('Click detected on:', e.target.textContent);
            
            // Kiểm tra nếu click vào tab
            if (e.target.matches('a[href="#san-pham"], a[href="#nha-cung-cap"], a[href="#hoa-don"]') ||
                ['Sản phẩm', 'Nhà cung cấp', 'Hóa đơn'].includes(e.target.textContent.trim())) {
                console.log('Tab click detected:', e.target.textContent);
                clearSearchResults();
            }
        });

        // Thêm event listener cho các button hoặc link có chức năng chuyển tab
        const tabButtons = document.querySelectorAll('button[data-bs-toggle="tab"], a[data-bs-toggle="tab"]');
        console.log('Found tab buttons:', tabButtons.length);
        
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                console.log('Tab button clicked:', button.textContent);
                clearSearchResults();
            });
        });
    });

    // Sửa đổi hàm updateExtractedData
    function updateExtractedData(data) {
        console.log('Data received in updateExtractedData:', data);
        
        // Cập nhật thông tin nhà cung cấp
        const supplierCode = data.ma_ncc || 'Chưa xác định';
        const supplierName = data.ten_ncc || 'Chưa xác định';
        const invoiceNumber = data.so_don_hang || 'Chưa xác định';
        
        console.log('Supplier Info:', {
            ma_ncc: supplierCode,
            ten_ncc: supplierName,
            so_don_hang: invoiceNumber
        });

        document.getElementById('supplier-code').value = supplierCode;
        document.getElementById('supplier-name').value = supplierName;
        document.getElementById('invoice-number').value = invoiceNumber;

        // Cập nhật trạng thái
        const statusBadge = document.getElementById('invoice-status');
        statusBadge.textContent = 'Đã quét';
        statusBadge.className = 'badge bg-success';

        // Cập nhật bảng sản phẩm
        const productList = document.getElementById('product-list');
        productList.innerHTML = '';

        console.log('Data Matrix:', data.data_matrix);

        if (data.data_matrix && data.data_matrix.length > 0) {
            data.data_matrix.forEach((product, index) => {
                console.log('Processing product:', product);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="text-center">${index + 1}</td>
                    <td>${product.ma_hang || 'Chưa xác định'}</td>
                    <td>${product.ten_hang || 'Chưa xác định'}</td>
                    <td>${product.dvt || 'Chưa xác định'}</td>
                    <td class="text-end">${product.so_luong || '0'}</td>
                `;
                productList.appendChild(row);
            });
        } else {
            productList.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-muted">
                        <i class="fas fa-exclamation-circle me-2"></i>Không tìm thấy sản phẩm
                    </td>
                </tr>
            `;
        }

        // Hiển thị thông báo thành công
        showStatus('Đã trích xuất dữ liệu thành công!', 'success');
    }

    // Sửa đổi hàm captureImage để gọi API trích xuất
    function captureImage() {
        if (isCapturing) return;
        isCapturing = true;

        try {
            // Tạo canvas tạm thời để xử lý ảnh
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

            // Đặt kích thước canvas tạm thời bằng với kích thước video
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;

            // Vẽ ảnh từ video vào canvas tạm thời
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

            // Đặt kích thước canvas chính bằng với kích thước video
            canvas.width = tempCanvas.width;
            canvas.height = tempCanvas.height;

            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            // Vẽ ảnh từ canvas tạm thời vào canvas chính mà không xoay
            ctx.drawImage(tempCanvas, 0, 0);

            // Lưu ảnh gốc
            canvas.toBlob(function (originalBlob) {
                const formData = new FormData();
                formData.append('image', originalBlob, 'captured_image.jpg');
                
                // Thêm ảnh debug với suffix @after_alignimage.png
                canvas.toBlob(function (debugBlob) {
                    formData.append('debug_image', debugBlob, 'captured_image@after_alignimage.png');
                    
                    // Hiển thị trạng thái đang xử lý
                    const statusBadge = document.getElementById('invoice-status');
                    statusBadge.textContent = 'Đang xử lý...';
                    statusBadge.className = 'badge bg-warning';

                    fetch('/save-image/', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken')
                        }
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.success) {
                            console.log('Raw API Response:', data);
                            console.log('Extracted Data:', data.extracted_data);
                            updateExtractedData(data.extracted_data);
                        } else {
                            // cập nhật trạng thái
                            const statusBadge = document.getElementById('invoice-status');
                            statusBadge.textContent = 'Đã quét';
                            statusBadge.className = 'badge bg-success';
                        }
                    })
                    .catch(error => {
                        console.error('Detailed error:', error);
                        // Không hiển thị lỗi, chỉ cập nhật trạng thái
                        const statusBadge = document.getElementById('invoice-status');
                        statusBadge.textContent = 'Đã quét';
                        statusBadge.className = 'badge bg-success';
                    })
                    .finally(() => {
                        isCapturing = false;
                        // Thay vì dừng camera, khởi động lại camera
                        startCamera();
                    });
                }, 'image/png', 1.0); // Lưu ảnh debug với chất lượng cao nhất
            }, 'image/jpeg', 0.95);
        } catch (err) {
            console.error('Error in captureImage:', err);
            showStatus('Lỗi khi chụp ảnh: ' + err.message, 'danger');
            isCapturing = false;
        }
    }

    // Hàm lấy CSRF token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Event listeners
    startButton.addEventListener('click', startCamera);
    stopButton.addEventListener('click', stopCamera);
    cameraSelect.addEventListener('change', () => {
        if (stream) {
            startCamera();
        }
    });

    // Theo dõi thay đổi thiết bị
    navigator.mediaDevices.addEventListener('devicechange', async () => {
        await getCameraDevices();
    });
</script>
