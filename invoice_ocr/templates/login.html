{% load static %}
<!doctype html>
<html lang="en">

<head>
  <title>MM Login</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="{% static 'assets/img/MM_logo.png' %}" rel="icon">
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

  <link rel="stylesheet" href="{% static 'assets/css/login_style.css' %}">

</head>

<body class="img js-fullheight" style="background-image: url({% static 'assets/img/loginbg.jpg' %});">
  <section class="ftco-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 text-center mb-5">
          <h2 class="heading-section">Đăng nhập</h2>
        </div>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="login-wrap p-0">
            {% if error %}
            <div class="alert alert-danger" role="alert">
              {{ error }}
            </div>
            {% endif %}
            <form method="POST" class="signin-form">
              {% csrf_token %}
              <div class="form-group">
                <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập" required style="width: 100%; background-color: rgba(255, 255, 255, 0.1)!important;">
              </div>
              <div class="form-group">
                <input id="password-field" type="password" name="password" class="form-control" placeholder="Mật khẩu" required style="width: 100%; background-color: rgba(255, 255, 255, 0.1)!important;">
                <span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password"></span>
              </div>  
              <div class="form-group">
                <button type="submit" class="form-control btn btn-primary submit px-3">Đăng nhập</button>
              </div>
              <div class="form-group d-md-flex">
                <div class="w-50">
                  <label class="checkbox-wrap checkbox-primary">Ghi nhớ đăng nhập
                    <input type="checkbox" name="remember" checked>
                    <span class="checkmark"></span>
                  </label>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="{% static 'assets/js/jquery.min.js' %}"></script>
  <script src="{% static 'assets/js/popper.js' %}"></script>
  <script src="{% static 'assets/js/bootstrap.min.js' %}"></script>
  <script src="{% static 'assets/js/login-main.js' %}"></script>

</body>

</html>
